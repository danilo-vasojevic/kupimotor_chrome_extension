<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#667eea" rx="24"/>
  
  <!-- Motorcycle body -->
  <g transform="translate(64, 64)">
    <!-- Back wheel -->
    <circle cx="-28" cy="18" r="14" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="-28" cy="18" r="10" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="-28" cy="18" r="6" fill="#fff" opacity="0.3"/>
    
    <!-- Front wheel -->
    <circle cx="28" cy="18" r="14" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="28" cy="18" r="10" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="28" cy="18" r="6" fill="#fff" opacity="0.3"/>
    
    <!-- Frame -->
    <line x1="-28" y1="4" x2="28" y2="4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="4" x2="32" y2="-12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Engine block -->
    <rect x="-8" y="0" width="16" height="14" fill="#fff" opacity="0.4" rx="2"/>
    
    <!-- Handlebars -->
    <line x1="32" y1="-12" x2="36" y2="-16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="-16" x2="28" y2="-16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="-16" x2="44" y2="-16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Seat -->
    <ellipse cx="-12" cy="-8" rx="10" ry="6" fill="#fff" opacity="0.5"/>
    
    <!-- Headlight -->
    <circle cx="32" cy="-12" r="3" fill="#FFD700"/>
    
    <!-- Speed lines for dynamic feel -->
    <line x1="-42" y1="-6" x2="-50" y2="-6" stroke="#fff" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="-50" y2="0" stroke="#fff" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <line x1="-42" y1="6" x2="-50" y2="6" stroke="#fff" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>